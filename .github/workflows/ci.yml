name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o dist/ipcheck ./cmd/ipcheck

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ipcheck-linux-amd64
          path: dist/ipcheck
